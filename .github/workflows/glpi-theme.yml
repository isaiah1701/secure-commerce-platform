name: Build and deploy GLPI SOC workspace

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.glpi"
      - "glpi-theme/**"
      - "glpi-plugin/socops/**"
      - ".github/workflows/glpi-theme.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: glpi-theme-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy GLPI SOC workspace
    runs-on: ubuntu-latest
    environment: dev
    env:
      GLPI_CONTAINER_APP_NAME: secure-commerce-dev-glpi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: glpi-plugin/socops/ui/package-lock.json

      - name: Install SOC workspace dependencies
        working-directory: glpi-plugin/socops/ui
        run: npm ci --no-audit --no-fund

      - name: Test SOC workspace helpers
        working-directory: glpi-plugin/socops/ui
        run: npm test

      - name: Lint SOC workspace
        working-directory: glpi-plugin/socops/ui
        run: npm run lint

      - name: Build SOC workspace
        working-directory: glpi-plugin/socops/ui
        run: npm run build

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish immutable GLPI image
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          az acr login --name "${{ vars.ACR_NAME }}" &&
          docker build --pull --file Dockerfile.glpi
          --tag "${ACR_LOGIN_SERVER}/glpi:${IMAGE_TAG}" . &&
          docker push "${ACR_LOGIN_SERVER}/glpi:${IMAGE_TAG}"

      - name: Deploy GLPI image only
        run: |
          revision_suffix="socops-${GITHUB_SHA::12}"
          revision_name="${GLPI_CONTAINER_APP_NAME}--${revision_suffix}"
          az containerapp update \
            --name "$GLPI_CONTAINER_APP_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/glpi:${{ github.sha }}" \
            --revision-suffix "$revision_suffix"

          for attempt in {1..30}; do
            revision_health=$(az containerapp revision list \
              --name "$GLPI_CONTAINER_APP_NAME" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?name=='${revision_name}'].properties.healthState | [0]" \
              --output tsv)

            if [[ "$revision_health" == "Healthy" ]] && \
               curl --fail --silent --show-error https://ticket.platf0rm.site/ >/dev/null; then
              echo "GLPI revision ${revision_name} is healthy"
              exit 0
            fi
            echo "Revision health check attempt ${attempt}/30: ${revision_health:-pending}; retrying in 10 seconds"
            sleep 10
          done
          echo "The new GLPI revision did not become healthy"
          exit 1

      - name: Verify GLPI is healthy
        run: curl --fail --silent --show-error https://ticket.platf0rm.site/ >/dev/null
